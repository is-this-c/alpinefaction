name: CI

on:
  push:
    paths-ignore: &paths
      - '**.md'
  pull_request:
    paths-ignore: *paths
  workflow_dispatch:

permissions: {}

env:
  BUILD_TYPE: Release
  SCCACHE_GHA_ENABLED: 'true'

jobs:
  build-gnu:
    runs-on: ubuntu-24.04
    # GCC 14 MinGW required for C++23 deducing-this (game_patch targets cxx_std_23).
    # Use mirror.gcr.io to avoid Docker Hub rate limits on shared GitHub runners.
    container:
      image: mirror.gcr.io/library/debian:trixie

    steps:
    - uses: actions/checkout@v6
    - uses: mozilla-actions/sccache-action@v0.0.10
    
    - uses: actions/checkout@v6
      with:
        repository: is-this-c/pure_faction_ac
        token: ${{ secrets.PURE_FACTION_AC_TOKEN }}
        path: .pure_faction_ac

    - name: Import pf_secret.cpp etc.
      run: |
        src=.pure_faction_ac/game_patch/purefaction
        dst=game_patch/purefaction

        for f in pf_secret.cpp pf_secret_packets.h pf_secret_asm_obf.h; do
          [ -f "$src/$f" ] && cp "$src/$f" "$dst/"
        done

        if [ -f "$dst/pf_secret.cpp" ]; then
          echo "Found pf_secret.cpp"
        else
          echo "Could not find pf_secret.cpp"
        fi

    - name: Install packages
      run: |
        dpkg --add-architecture i386
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          g++-mingw-w64-i686-posix ninja-build wine32 wine cmake ca-certificates

    - name: Create a build environment
      run: cmake -E make_directory ./build

    - name: Configure CMake
      working-directory: ./build
      run: |
        cmake .. \
          -G Ninja \
          -D CMAKE_C_COMPILER_LAUNCHER=sccache \
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -D CMAKE_BUILD_TYPE=$BUILD_TYPE \
          -D CMAKE_TOOLCHAIN_FILE=../cmake/mingw-ubuntu.cmake

    - name: Build
      working-directory: ./build
      run: |
        export WINEPREFIX=$GITHUB_WORKSPACE/.wine
        mkdir -p $WINEPREFIX
        cmake --build . -j $(nproc)

    - name: Stage artifacts
      shell: bash
      run: |
        set -euo pipefail
        out="$GITHUB_WORKSPACE/dist/gnu"
        mkdir -p "$out"

        want=(AlpineFaction.dll)

        for f in "${want[@]}"; do
          src="$(find "$GITHUB_WORKSPACE/build" -type f -name "$f" -print -quit || true)"
          if [ -z "$src" ]; then
            echo "[ERROR] Missing $f (not found under build/)"
            echo 'Dumping likely output dirs:'
            find "$GITHUB_WORKSPACE/build" -maxdepth 3 -type d -print
            exit 1
          fi
          cp -f "$src" "$out/$f"
        done

        echo 'Staged:'
        ls -la "$out"

    - name: Set SHORT_SHA
      run: echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"

    - name: Upload artifacts (GNU)
      uses: actions/upload-artifact@v6
      with:
        name: alpine_faction_+_dash_faction's_anticheat_gnu_${{ env.SHORT_SHA }}.zip
        path: dist/gnu/**
        if-no-files-found: error
        retention-days: 90

  build-msvc:
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6
    - uses: mozilla-actions/sccache-action@v0.0.10

    - name: Add VS_INSTALL and VS_TOOLS to GITHUB_ENV
      run: |
        $vs = (Get-CimInstance MSFT_VSInstance -Namespace root/cimv2/vs).InstallLocation
        "VS_INSTALL=$vs" >> $env:GITHUB_ENV
        "VS_TOOLS=$(Join-Path $vs Common7\Tools)" >> $env:GITHUB_ENV

    - name: Create a build environment
      run: cmake -E make_directory .\build

    - name: Configure CMake
      working-directory: ./build
      run: |
        Import-Module (Join-Path $env:VS_TOOLS Microsoft.VisualStudio.DevShell.dll)
        Enter-VsDevShell `
          -VsInstallPath $env:VS_INSTALL `
          -HostArch amd64 `
          -Arch x86 `
          -SkipAutomaticLocation `
          -DevCmdArguments '-vcvars_ver=14.44'
        cmake .. `
          -G Ninja `
          -D CMAKE_C_COMPILER_LAUNCHER=sccache `
          -D CMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -D CMAKE_BUILD_TYPE="$env:BUILD_TYPE"

    - name: Build
      working-directory: ./build
      run: |
        Import-Module (Join-Path $env:VS_TOOLS Microsoft.VisualStudio.DevShell.dll)
        Enter-VsDevShell `
          -VsInstallPath $env:VS_INSTALL `
          -HostArch amd64 `
          -Arch x86 `
          -SkipAutomaticLocation `
          -DevCmdArguments '-vcvars_ver=14.44'
        cmake --build . -j $env:NUMBER_OF_PROCESSORS
